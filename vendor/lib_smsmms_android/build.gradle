plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp' version '2.3.5'
    alias(libs.plugins.org.jetbrains.kotlin.android)
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.10'
    id("maven-publish") apply true
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = "com.afkanerd"
                artifactId = "lib_smsmms_android"
                version = "1.0.0"
            }
        }
    }
}

android {
    namespace 'com.afkanerd.lib_smsmms_android'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }

        resourceConfigurations += ["en", "fr", "ru", "de", "pl"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    publishing {
        singleVariant("release") {}
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildscript {
        ext.kotlin_version = '2.2'
        dependencies {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        }
    }
}

dependencies {

    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.room:room-common-jvm:2.8.4"
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.paging:paging-common:3.4.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.room:room-testing:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0"

    implementation "org.fossify:android-smsmms:c3e678befd"
    implementation "com.googlecode.libphonenumber:libphonenumber:9.0.25"

    def room_version = "2.8.4"

    // If this project uses any Kotlin source, use Kotlin Symbol Processing (KSP)
    // See KSP Quickstart to add KSP to your build
    ksp "androidx.room:room-compiler:$room_version"

    // If this project only uses Java source, use the Java annotationProcessor
    // No additional plugins are necessary
    annotationProcessor "androidx.room:room-compiler:$room_version"

//    // optional - RxJava2 support for Room
//    implementation libs.androidx.room.rxjava2
//
//    // optional - RxJava3 support for Room
//    implementation libs.androidx.room.rxjava3
//
//    // optional - Guava support for Room, including Optional and ListenableFuture
//    implementation libs.androidx.room.guava

    // optional - Test helpers
    testImplementation "androidx.room:room-testing:$room_version"

    // optional - Paging 3 Integration
    implementation "androidx.room:room-paging:$room_version"

    implementation("com.google.code.gson:gson:2.13.2")

    implementation "androidx.datastore:datastore-preferences:1.2.0"
    implementation "androidx.datastore:datastore-preferences-core:1.2.0"
    implementation "androidx.work:work-runtime-ktx:2.11.1"
    implementation "androidx.datastore:datastore-preferences:1.2.0"

    api 'net.zetetic:sqlcipher-android:4.14.1@aar'
    api 'androidx.sqlite:sqlite:2.6.2'
    implementation "androidx.security:security-crypto:1.1.0"
    // Preferences DataStore (SharedPreferences like APIs)
    implementation "androidx.datastore:datastore-preferences:1.2.0"

    // Alternatively - without an Android dependency.
    implementation "androidx.datastore:datastore-preferences-core:1.2.0"
}
