name: Android Release APK

on:
  push:
    branches: [messages, main, master]
    paths:
      - 'app/**'
      - 'vendor/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release version
        shell: bash
        run: |
          base_version="$(sed -n 's/^versionName=//p' version.properties)"
          base_code="$(sed -n 's/^tagVersion=//p' version.properties)"
          test -n "$base_version" && test -n "$base_code"
          version_name="${base_version}-${GITHUB_RUN_NUMBER}"
          version_code_base="$((base_code + GITHUB_RUN_NUMBER))"
          version_code="$((version_code_base * 100))"
          {
            echo "VERSION_NAME=$version_name"
            echo "VERSION_CODE_BASE=$version_code_base"
            echo "VERSION_CODE=$version_code"
            echo "RELEASE_TAG=v$version_name"
          } >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/messages-release.keystore"
          test -s "$RUNNER_TEMP/messages-release.keystore"

      - name: Test and build universal release APK
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE_BASE: ${{ env.VERSION_CODE_BASE }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -PuniversalApk=true --no-daemon --console=plain

      - name: Sign and verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          mkdir -p release-assets
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/messages-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "release-assets/Messages-${RELEASE_TAG}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose --print-certs "release-assets/Messages-${RELEASE_TAG}.apk"
          cd release-assets
          sha256sum "Messages-${RELEASE_TAG}.apk" > "Messages-${RELEASE_TAG}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Сообщения ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            Автоматическая стабильная сборка приложения «Сообщения» для Android.

            Скачайте APK ниже или откройте «Настройки → Обновления» в приложении. Переписки и настройки при обновлении сохраняются.

            Version: ${{ env.VERSION_NAME }}
            Version code: ${{ env.VERSION_CODE }}
            Commit: ${{ github.sha }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/messages-release.keystore"
